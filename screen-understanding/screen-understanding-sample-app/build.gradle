plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qualcomm.qaior.screen_understanding.sample_app'
    compileSdk 35

    defaultConfig {
        applicationId "com.qualcomm.qaior.screen_understanding.sample_app"
        minSdk 33
        targetSdk 35
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        aidl = true
    }

    sourceSets {
        main {
            // Reference shared AIDL file instead of copying
            aidl.srcDirs = [
                'src/main/aidl',
                '../../app/screen_understanding/src/main/aidl'
            ]
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
